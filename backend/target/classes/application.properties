
server.port=3001

# H2 console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / H2 - use a file-based H2 DB so data persists across restarts
# Database file will live at backend/data/recipedb.mv.db
spring.datasource.url=jdbc:h2:file:./backend/data/recipedb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# uploads dir
app.upload.dir=backend/uploads

